<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>{{.Brand}} · Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080b12;--panel:#111722;--panel2:#161e2b;--line:rgba(148,163,184,.14);--text:#e9eef8;--muted:#8493a8;--faint:#5e6d82;--brand:#f4efe4;--ink:#16120c;--violet:#8b5cf6;--cyan:#22d3ee;--emerald:#34d399;--amber:#fbbf24;--rose:#fb7185}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.shell{max-width:460px;margin:0 auto;padding:16px 14px 90px}
.hero{padding:18px 18px 16px;border:1px solid var(--line);border-radius:20px;background:radial-gradient(120% 120% at 100% 0%,rgba(139,92,246,.18),transparent 55%),linear-gradient(160deg,var(--panel),#0b1019);margin-bottom:14px}
.brand{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hello{font-size:22px;font-weight:650;margin:6px 0 2px;letter-spacing:-.03em}
.sub{font-size:11px;color:var(--muted)}
.points{display:flex;gap:10px;margin-top:14px}
.points div{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px}
.points b{display:block;font-size:19px;letter-spacing:-.03em}
.points span{font-size:9px;color:var(--faint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:13px}
.card p{margin:0;font-size:11px;line-height:1.7;color:var(--muted)}
.btn{width:100%;border:0;border-radius:12px;padding:12px;font-size:12px;font-weight:650;cursor:pointer;background:var(--brand);color:var(--ink)}
.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,21,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:9}
.tab{flex:1;border:0;background:transparent;color:var(--faint);font-size:10px;padding:6px;border-radius:10px;cursor:pointer}
.tab.active{color:var(--text);background:rgba(255,255,255,.05)}
.page{display:none}.page.active{display:block}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}.item .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);font-size:18px;flex:none}
.item .body{flex:1;min-width:0}.item b{display:block;font-size:12px}.item small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.chip{display:inline-block;padding:3px 7px;border-radius:99px;font-size:8px;border:1px solid var(--line);color:var(--muted)}
.chip.on{color:var(--emerald);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
.empty{padding:30px 10px;text-align:center;color:var(--faint);font-size:11px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1d2736;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90%}
.toast.show{opacity:1}
textarea,input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:10px;font-size:11px;font-family:inherit;resize:vertical}
</style>
</head>
<body data-group="{{.GroupID}}">
<div class="shell">
  <div class="hero">
    <div class="brand">{{.Brand}} · MEMBER</div>
    <div class="hello" id="hello">正在连接…</div>
    <div class="sub" id="group-name">Telegram 群成员中心</div>
    <div class="points">
      <div><b id="points">—</b><span>当前积分</span></div>
      <div><b id="streak">—</b><span>签到状态</span></div>
      <div><b id="member-state">—</b><span>会员状态</span></div>
    </div>
  </div>

  <div class="page active" id="page-home">
    <div class="card">
      <h3>今日签到</h3>
      <p id="checkin-hint">每天签到，积累积分。</p>
      <button class="btn" id="checkin-btn" style="margin-top:10px">签到领取积分</button>
    </div>
    <div class="card">
      <h3>最近任务</h3>
      <div id="home-tasks"></div>
    </div>
  </div>

  <div class="page" id="page-shop">
    <div class="card"><h3>积分商城</h3><div id="shop-list"></div></div>
  </div>

  <div class="page" id="page-tasks">
    <div class="card"><h3>任务中心</h3><div id="task-list"></div></div>
  </div>

  <div class="page" id="page-me">
    <div class="card">
      <h3>提交申诉 / 工单</h3>
      <p>被误禁言、订单问题或建议，都可以在这里提交。</p>
      <input id="ticket-subject" placeholder="主题（可选）" style="margin-top:10px">
      <textarea id="ticket-body" rows="4" placeholder="详细描述发生了什么" style="margin-top:8px"></textarea>
      <button class="btn" id="ticket-btn" style="margin-top:8px">提交工单</button>
    </div>
    <div class="card">
      <h3>我的身份</h3>
      <p id="me-line">—</p>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="home">首页</button>
  <button class="tab" data-tab="shop">商城</button>
  <button class="tab" data-tab="tasks">任务</button>
  <button class="tab" data-tab="me">我的</button>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
const GROUPD = Number(document.body.dataset.group || 0);
let state = null;
const $ = (s) => document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function payload(extra={}){return Object.assign({init_data:tg?.initData || '', group_id:GROUPD},extra)}
async function api(path, body={}, method='POST'){
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload(body))});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok) throw new Error(j.error || '请求失败');
  return j.data;
}
function render(){
  if(!state) return;
  const u=state.user,g=state.group;
  $('#hello').textContent='你好，'+(u.first_name||u.username||'成员');
  $('#group-name').textContent=g.title+' · '+g.member_count+' 位成员';
  $('#points').textContent=state.balance;
  $('#streak').textContent=state.checked_in?'已签':'未签';
  $('#member-state').textContent=state.membership?.status==='active'?'会员':'普通';
  $('#checkin-hint').textContent=state.checked_in?'今天已经签到过了，明天再来。':'签到可获得积分，连续签到有加成。';
  $('#checkin-btn').disabled=state.checked_in;
  const items=state.items||[];
  $('#shop-list').innerHTML=items.length?items.map(it=>`<div class="item"><span class="ico">${esc(it.icon||'🎁')}</span><div class="body"><b>${esc(it.name)}</b><small>${it.cost_points} 积分 · ${it.stock===-1?'不限量':'剩余 '+it.stock}</small></div><button class="btn ghost" style="width:auto;padding:8px 10px" onclick="redeem(${it.id})">兑换</button></div>`).join(''):'<div class="empty">商城还是空的</div>';
  const tasks=state.tasks||[];
  const taskHtml=tasks.length?tasks.map(t=>`<div class="item"><div class="body"><b>${esc(t.name)}</b><small>${t.progress??0}/${t.target} · +${t.reward_points} 积分</small></div>${t.claimed?'<span class="chip">已领</span>':(t.progress??0)>=t.target?`<button class="btn" style="width:auto;padding:8px 10px" onclick="claim(${t.id})">领取</button>`:'<span class="chip">进行中</span>'}</div>`).join(''):'<div class="empty">暂无任务</div>';
  $('#task-list').innerHTML=taskHtml;
  $('#home-tasks').innerHTML=taskHtml;
  $('#me-line').textContent=(u.username?'@'+u.username:'ID '+u.id)+' · 累计获得 '+state.total_earned+' 积分';
}
async function load(){
  try { state=await api('/api/miniapp/overview',{group_id:GROUPD}); render(); }
  catch(e){ $('#hello').textContent='需要从 Telegram 打开'; $('#group-name').textContent=e.message; }
}
async function checkin(){
  try{const r=await api('/api/miniapp/checkin',{group_id:GROUPD});toast('签到成功 +'+r.points);await load()}catch(e){toast(e.message)}
}
async function redeem(id){
  try{const r=await api('/api/miniapp/shop/redeem',{group_id:GROUPD,item_id:id});toast('兑换成功，余额 '+r.balance);await load()}catch(e){toast(e.message)}
}
async function claim(id){
  try{const r=await api('/api/miniapp/tasks/claim',{group_id:GROUPD,task_id:id});toast('领取成功 +'+r.points);await load()}catch(e){toast(e.message)}
}
$('#checkin-btn').onclick=checkin;
$('#ticket-btn').onclick=async()=>{
  try{const r=await api('/api/miniapp/ticket',{group_id:GROUPD,subject:$('#ticket-subject').value,body:$('#ticket-body').value});toast('工单 #'+r.ticket_id+' 已提交');$('#ticket-body').value=''}catch(e){toast(e.message)}
};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+b.dataset.tab));
});
tg?.ready?.(); tg?.expand?.();
load();
</script>
</body>
</html>
